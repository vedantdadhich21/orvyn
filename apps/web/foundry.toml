[profile.default]
src = "contracts"
out = "contracts/out"
cache_path = "contracts/cache"
libs = []
remappings = ["@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
allow_paths = ["../../node_modules"]
